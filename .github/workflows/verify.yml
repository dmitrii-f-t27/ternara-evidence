name: Cross-platform evidence replay
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  replay:
    name: ${{ matrix.runner }} / ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            arch: x64
          - runner: ubuntu-24.04-arm
            arch: arm64
          - runner: windows-2025
            arch: x64
          - runner: macos-15
            arch: arm64
          - runner: macos-15-intel
            arch: x64
    env:
      EXPECTED_NODE_ARCH: ${{ matrix.arch }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24.13.0'
      - name: Verify published fingerprints
        run: python tools/check_integrity.py
      - name: Independent Python reference and refusal controls
        run: python -m unittest discover -s tests -v
      - name: Replay with Python
        run: python verify_results.py --output results/python.json
      - name: Replay with public t27 WASM reference
        run: node verify_t27.mjs --output results/t27.json
      - name: Refuse altered t27 replay inputs
        run: node tools/test_t27_refusals.mjs
      - name: Native generated C tests
        if: runner.os != 'Windows'
        shell: bash
        run: |
          cc -std=gnu11 -Wno-parentheses-equality -DT27_TEST_MAIN demo/mac32_reference.c -o results/reference-tests
          results/reference-tests
      - name: Store actual environment receipts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: replay-${{ matrix.runner }}
          path: results/*.json
          retention-days: 90
          if-no-files-found: warn
